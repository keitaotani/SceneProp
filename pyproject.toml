[project]
name = "sceneprop"
version = "0.1.0"
description = "[WACV 2026] SceneProp: Combining Neural Network and Markov Random Field for Scene-Graph Grounding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "graphviz>=0.21",
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tensorboard>=2.20.0",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
